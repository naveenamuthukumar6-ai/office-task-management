{% extends 'base.html' %}
{% block content %}

<div class="form-center">
    <div class="form-card">
        <h2>Edit Daily Task</h2>

        <form method="POST">
            {% csrf_token %}

            <input type="text" name="title" value="{{ task.title }}" required>

            <select name="status">
    <option value="Pending" {% if task.status == "Pending" %}selected{% endif %}>
        Pending
    </option>
    <option value="In Progress" {% if task.status == "In Progress" %}selected{% endif %}>
        In Progress
    </option>
    <option value="Completed" {% if task.status == "Completed" %}selected{% endif %}>
        Completed
    </option>
</select>

            <button type="submit" class="full-width-btn">
                Update Task
            </button>
        </form>
    </div>
</div>

{% endblock %}
